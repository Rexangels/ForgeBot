services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: forgebot
      POSTGRES_PASSWORD: forgebot
      POSTGRES_DB: forgebot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgebot"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: forgebot
      MINIO_ROOT_PASSWORD: forgebot123
    volumes:
      - miniodata:/data

  api:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    env_file: ./backend/.env
    environment:
      FORGEBOT_DATABASE_URL: postgres://forgebot:forgebot@db:5432/forgebot
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: python manage.py runworker
    env_file: ./backend/.env
    depends_on:
      - redis
      - db

  sim-worker:
    build: ./backend
    command: python manage.py runworker --sim-only
    env_file: ./backend/.env
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    depends_on:
      - redis
      - db

volumes:
  pgdata:
  miniodata:
